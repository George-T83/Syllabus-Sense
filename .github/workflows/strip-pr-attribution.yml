name: Strip PR Attribution

# Some PR-creation paths inject a "Generated with Claude Code" footer (and
# similar) into the PR body server-side, after the fact - text that never
# appeared in what a session actually wrote, so it can't be prevented at
# authoring time the way the commit-msg hook prevents it for commits. This
# scrubs it back out immediately whenever a PR is opened or its body edited.
# See scripts/attributionPatterns.js for the shared definition of what
# counts as attribution.

on:
  pull_request:
    types: [opened, edited, reopened]

# Declaring any permission drops every other one to "none". The repository is
# private, so without `contents: read` the checkout below cannot fetch it and
# fails with "Repository not found" before the job does any work.
permissions:
  contents: read
  pull-requests: write

# One scrub at a time per PR; a newer edit supersedes a run still going.
concurrency:
  group: strip-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strip:
    # Cheap pre-filter evaluated before any runner is started, so a PR body
    # with nothing to scrub costs no Actions minutes at all. It is a superset
    # of everything scripts/attributionPatterns.js matches (every pattern there
    # matches one of the keywords the stripper looks for; `contains` ignores case), and
    # scripts/__tests__/ciScope.test.ts guards that. The script below remains
    # the one that decides what is actually removed.
    if: contains(github.event.pull_request.body, 'claude') || contains(github.event.pull_request.body, 'co-authored-by')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/attributionPatterns.js
          sparse-checkout-cone-mode: false

      - name: Strip AI attribution from PR body
        uses: actions/github-script@v7
        with:
          script: |
            const { stripAiAttribution } = require(process.env.GITHUB_WORKSPACE + '/scripts/attributionPatterns.js');
            const body = context.payload.pull_request.body || '';
            const cleaned = stripAiAttribution(body);
            if (cleaned !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: cleaned,
              });
              core.notice('Stripped AI attribution from the PR body.');
            } else {
              core.info('PR body already clean - nothing to strip.');
            }
