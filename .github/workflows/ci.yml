name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Java (for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Check Commit Messages for AI Attribution
        id: attribution
        if: github.event_name == 'pull_request'
        run: |
          if node scripts/check-commit-attribution.mjs "origin/${{ github.base_ref }}..HEAD"; then
            echo "status=Pass" >> $GITHUB_OUTPUT
          else
            echo "status=Fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Linter
        id: lint
        run: |
          if npm run lint; then
            echo "status=Pass" >> $GITHUB_OUTPUT
          else
            echo "status=Fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Build
        id: build
        run: |
          if npm run build; then
            echo "status=Pass" >> $GITHUB_OUTPUT
          else
            echo "status=Fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Unit Tests
        id: test
        run: |
          if npm run test; then
            echo "status=Pass" >> $GITHUB_OUTPUT
          else
            echo "status=Fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Firestore Rules Tests
        id: rules-test
        run: |
          if npm run test:rules; then
            echo "status=Pass" >> $GITHUB_OUTPUT
          else
            echo "status=Fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      # Gated at "critical" only, not the repo's current baseline of high/
      # moderate findings (all in transitive deps requiring a major-version
      # bump tracked separately) - this exists to catch a *new* critical
      # regression, not to silently pass while masking the known gap. The
      # script (not a bare `npm audit --audit-level=critical`) checks each
      # critical finding against scripts/acceptedCriticalVulnerabilities.json
      # so an already-tracked, dated, reasoned exception doesn't block every
      # future PR forever - see that file for what's currently accepted.
      - name: Check for Critical Dependency Vulnerabilities
        id: audit
        run: |
          if node scripts/check-critical-audit.mjs; then
            echo "status=Pass" >> $GITHUB_OUTPUT
          else
            echo "status=Fail" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## CI Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Attribution | ${{ steps.attribution.outputs.status || 'N/A (push to main)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outputs.status || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outputs.status || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.test.outputs.status || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firestore Rules Tests | ${{ steps.rules-test.outputs.status || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit (critical) | ${{ steps.audit.outputs.status || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY

  # Runs the real app against the Firebase emulators in a browser. It is a
  # separate job so a flaky browser run never blocks the required check above;
  # it reports on every PR so a broken sign-in or empty dashboard shows up.
  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Java (for the emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Install Browser
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Smoke Tests
        run: npm run test:e2e:emulated

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 7
