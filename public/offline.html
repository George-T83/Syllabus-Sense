<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Syllabus Sense</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #f6f5ff;
        color: #1c1b22;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f0e15;
          color: #ecebf4;
        }
        p {
          color: #a09eb2;
        }
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.55;
        color: #5d5b6a;
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #5b3df5;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved on this device yet. Pages you have already opened work without a
        connection, so open this one once while you're online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
